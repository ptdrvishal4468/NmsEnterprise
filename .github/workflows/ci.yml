name: Enterprise NMS CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  build-and-test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for seamless merging

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore NmsEnterprise.slnx

      - name: Build Solution
        run: dotnet build NmsEnterprise.slnx --no-restore --configuration Release

      - name: Execute Unit and Integration Tests
        run: dotnet test NmsEnterprise.slnx --no-build --configuration Release --verbosity normal

  auto-merge-to-develop:
    name: Auto-Merge Feature to Develop
    needs: build-and-test
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Feature Branch into Develop
        run: |
          git fetch origin develop:develop
          git checkout develop
          git merge --no-ff ${{ github.ref }} -m "ci(auto-merge): merge ${{ github.ref_name }} into develop [skip ci]"
          git push origin develop