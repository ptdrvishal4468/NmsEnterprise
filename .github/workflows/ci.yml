name: Enterprise NMS CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop    

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  build-and-test:
    name: Build & Full Regression Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore NmsEnterprise.slnx

      - name: Verify Code Formatting
        run: dotnet format NmsEnterprise.slnx --verify-no-changes --verbosity diagnostic

      # [PHASE 24 ENHANCEMENT] Native .NET Security & Code Analyzer Inspection
      - name: Build & Run Static Code Analysis
        run: dotnet build NmsEnterprise.slnx --no-restore --configuration Release /p:AnalysisLevel=latest /p:EnableNETAnalyzers=true /p:TreatWarningsAsErrors=true
   
      # [PHASE 51 ENHANCEMENT] Container Image & Dockerfile Build Verification
      - name: Verify Container Image Build
        run: docker build -f Nms.Api/Dockerfile -t nms-enterprise-api:ci-build-test .  

      # [PHASE 23 ENHANCEMENT] Execute Tests with Cobertura Coverage Collection
      - name: Execute Full Test Suite & Collect Coverage
        run: >
          dotnet test NmsEnterprise.slnx 
          --no-build 
          --configuration Release 
          --verbosity normal 
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage" 
          --results-directory ./TestResults

      # [PHASE 21 ENHANCEMENT] Code Coverage Summary Generation
      - name: Generate Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: 'TestResults/**/coverage.cobertura.xml'
          badge: true
          fail_below_min: false
          format: markdown
          output: both

      - name: Publish Coverage Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f code-coverage-summary.md ]; then
            cat code-coverage-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "Coverage summary generated successfully." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results and Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results-${{ github.sha }}
          path: ./TestResults
          if-no-files-found: warn
  
  security-audit:
    name: Dependency & Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit Dependency Vulnerabilities
        run: dotnet list NmsEnterprise.slnx package --vulnerable --include-transitive

      - name: Audit Deprecated Dependencies
        run: dotnet list NmsEnterprise.slnx package --deprecated --include-transitive

  publish-build-artifacts:
    name: Publish Application Artifacts
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Nms.Api
        run: dotnet publish Nms.Api/Nms.Api.csproj -c Release -o ./publish-output /p:UseAppHost=false

      - name: Upload Published Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nms-enterprise-api-release-${{ github.sha }}
          path: ./publish-output
          retention-days: 14

  auto-merge-to-develop:
    name: Auto-Merge Feature to Develop
    needs: [build-and-test, security-audit]
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Feature Branch into Develop
        run: |
          git fetch origin develop:develop
          git checkout develop
          git merge --no-ff ${{ github.ref }} -m "ci(auto-merge): merge ${{ github.ref_name }} into develop [skip ci]"
          git push origin develop