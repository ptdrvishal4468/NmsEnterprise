name: Enterprise NMS CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore NmsEnterprise.slnx

      - name: Build Solution
        run: dotnet build NmsEnterprise.slnx --no-restore --configuration Release

      - name: Execute Unit and Integration Tests
        run: dotnet test NmsEnterprise.slnx --no-build --configuration Release --verbosity normal