name: Enterprise NMS Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  validate-and-build:
    name: Validate Release & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore NmsEnterprise.slnx

      - name: Build Solution
        run: dotnet build NmsEnterprise.slnx -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Execute Full Regression Suite
        run: dotnet test NmsEnterprise.slnx -c Release --no-build

      - name: Validate Production Compose Manifest
        run: docker compose -f docker-compose.prod.yml config  

      - name: Publish API Binary
        run: dotnet publish Nms.Api/Nms.Api.csproj -c Release -o ./release-package /p:UseAppHost=false

      - name: Build Tagged Container Image
        run: |
          RELEASE_TAG=${{ github.ref_name }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG=${{ inputs.release_version }}
          fi
          docker build -f Nms.Api/Dockerfile -t nms-enterprise-api:${RELEASE_TAG} .

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: nms-enterprise-api-${{ github.ref_name }}
          path: ./release-package
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: validate-and-build
    environment:
      name: staging

    steps:
      - name: Validate Staging Deployment Gate
        run: echo "Staging deployment pipeline gate verified successfully."

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production

    steps:
      - name: Validate Production Approval & Release Verification
        run: echo "Production approval verified. Pipeline gate ready for Phase 53 deployment runtime."