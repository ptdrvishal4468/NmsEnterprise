services:
  # --------------------------------------------------------------------------
  # 1. SQL Server Express Container
  # --------------------------------------------------------------------------
  nms.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nms_sql_server
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourSecurePass123!}
      - MSSQL_PID=Express
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # --------------------------------------------------------------------------
  # 2. Redis Distributed Cache Container
  # --------------------------------------------------------------------------
  nms.cache:
    image: redis:7-alpine
    container_name: nms_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # --------------------------------------------------------------------------
  # 3. .NET 10 NMS API Service
  # --------------------------------------------------------------------------
  nms.api:
    image: nms-enterprise-api:${APP_VERSION:-1.0.0}-${BUILD_TAG:-local}
    container_name: nms_api
    build:
      context: .
      dockerfile: Nms.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=nms.database,1433;Database=NmsEnterpriseDb;User Id=sa;Password=YourSecurePass123!;TrustServerCertificate=True;Pooling=true;Min Pool Size=5;Max Pool Size=1024;Connect Timeout=30;}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-nms.cache:6379,abortConnect=false,connectTimeout=5000}
      - JwtSettings__Secret=${JWT_SECRET:-EnterpriseSuperSecretCryptographicSigningKey_Nms2026!#$}
      - JwtSettings__Issuer=${JWT_ISSUER:-NmsEnterpriseApi}
      - JwtSettings__Audience=${JWT_AUDIENCE:-NmsEnterpriseClients}
      - OpenTelemetry__ServiceName=${OTEL_SERVICE_NAME:-NmsEnterprise.Api}
      - OpenTelemetry__OtlpEndpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      - OpenTelemetry__EnableTracing=${OTEL_ENABLE_TRACING:-true}
      - OpenTelemetry__EnableMetrics=${OTEL_ENABLE_METRICS:-true}
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    depends_on:
      nms.database:
        condition: service_healthy
      nms.cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: on-failure

volumes:
  sqlserver_data:
  redis_data: